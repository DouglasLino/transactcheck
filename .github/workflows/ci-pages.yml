
name: CI y despliegue TransactCheck

on:
  push:
    branches:
      - main
      - refactor-skills
  pull_request:
    branches:
      - main
      - refactor-skills
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactcheck-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y validar ambas versiones
    runs-on: ubuntu-latest

    steps:
      - name: Obtener version original
        uses: actions/checkout@v4
        with:
          ref: main
          path: original

      - name: Obtener version refactorizada
        uses: actions/checkout@v4
        with:
          ref: refactor-skills
          path: refactor

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            original/package-lock.json
            refactor/package-lock.json

      - name: Instalar dependencias originales
        working-directory: original
        run: npm ci

      - name: Instalar dependencias refactorizadas
        working-directory: refactor
        run: npm ci

      - name: Ejecutar pruebas originales si existen
        working-directory: original
        shell: bash
        run: |
          if npm run | grep -Eq '^[[:space:]]+test$'; then
            npm test -- --run
          else
            echo "No existe script test. Se omiten pruebas."
          fi

      - name: Ejecutar pruebas refactorizadas si existen
        working-directory: refactor
        shell: bash
        run: |
          if npm run | grep -Eq '^[[:space:]]+test$'; then
            npm test -- --run
          else
            echo "No existe script test. Se omiten pruebas."
          fi

      - name: Compilar version original
        working-directory: original
        run: npm run build -- --base=/transactcheck/

      - name: Compilar version refactorizada
        working-directory: refactor
        run: npm run build -- --base=/transactcheck/refactor/

      - name: Preparar publicacion
        shell: bash
        run: |
          mkdir -p public/refactor

          cp -a original/dist/. public/
          cp -a refactor/dist/. public/refactor/

          touch public/.nojekyll

          test -f public/index.html
          test -f public/refactor/index.html

          echo "Ambas versiones preparadas."

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar ambas versiones
    if: github.event_name != 'pull_request'

    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URLs publicadas
        run: |
          echo "Version original:"
          echo "https://douglaslino.github.io/transactcheck/"
          echo "Version refactorizada:"
          echo "https://douglaslino.github.io/transactcheck/refactor/"
