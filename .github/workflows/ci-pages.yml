name: CI y despliegue TransactCheck

on:
  push:
    branches:
      - main
      - feature/agentic-transformersjs
  pull_request:
    branches:
      - main
      - feature/agentic-transformersjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactcheck-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar y compilar ambas versiones
    runs-on: ubuntu-latest

    steps:
      - name: Obtener versión original desde main
        uses: actions/checkout@v4
        with:
          ref: main
          path: original

      - name: Obtener versión agentic
        uses: actions/checkout@v4
        with:
          ref: feature/agentic-transformersjs
          path: refactor

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            original/requirements-dev.txt
            refactor/requirements-dev.txt

      - name: Instalar dependencias Python de main
        working-directory: original
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar dependencias Python de la versión agentic
        working-directory: refactor
        run: python -m pip install -r requirements-dev.txt

      - name: Probar motor Python de main
        working-directory: original
        run: python -m pytest -q

      - name: Probar motor Python de la versión agentic
        working-directory: refactor
        run: python -m pytest -q

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            original/frontend/package-lock.json
            refactor/frontend/package-lock.json

      - name: Instalar frontend de main
        working-directory: original/frontend
        run: npm ci

      - name: Instalar frontend de la versión agentic
        working-directory: refactor/frontend
        run: npm ci

      - name: Ejecutar pruebas frontend de main si existen
        working-directory: original/frontend
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "main no define pruebas frontend; se continúa con las demás validaciones."
          fi

      - name: Ejecutar pruebas frontend de la versión agentic
        working-directory: refactor/frontend
        run: npm test -- --run

      - name: Verificar TypeScript de main
        working-directory: original/frontend
        run: npm run typecheck

      - name: Verificar TypeScript de la versión agentic
        working-directory: refactor/frontend
        run: npm run typecheck

      - name: Probar Pyodide de main
        working-directory: original/frontend
        run: npm run smoke:pyodide

      - name: Probar Pyodide de la versión agentic
        working-directory: refactor/frontend
        run: npm run smoke:pyodide

      - name: Compilar main para la ruta principal
        working-directory: original/frontend
        run: npm run build -- --base=/transactcheck/

      - name: Compilar versión agentic para la ruta refactor
        working-directory: refactor/frontend
        run: npm run build -- --base=/transactcheck/refactor/

      - name: Preparar sitio con ambas versiones
        shell: bash
        run: |
          mkdir -p public/refactor
          cp -a original/frontend/dist/. public/
          cp -a refactor/frontend/dist/. public/refactor/
          touch public/.nojekyll
          test -f public/index.html
          test -f public/refactor/index.html

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar ambas versiones
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URLs publicadas
        run: |
          echo "Versión main: https://douglaslino.github.io/transactcheck/"
          echo "Versión agentic: https://douglaslino.github.io/transactcheck/refactor/"
