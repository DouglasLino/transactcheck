name: CI y despliegue de TransactCheck

on:
  push:
    branches:
      - main
      - feature/agentic-transformersjs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Obtener ambas versiones
      # ==========================================

      - name: Obtener version original
        uses: actions/checkout@v5
        with:
          ref: main
          path: source-main

      - name: Obtener version agentica
        uses: actions/checkout@v5
        with:
          ref: feature/agentic-transformersjs
          path: source-agentic

      # ==========================================
      # 2. Configurar Python
      # ==========================================

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install -r source-main/requirements-dev.txt
          python -m pip install -r source-agentic/requirements-dev.txt

      # ==========================================
      # 3. Pruebas Python
      # ==========================================

      - name: Pruebas Python - Original
        working-directory: source-main
        run: python -m pytest -q

      - name: Pruebas Python - Agentica
        working-directory: source-agentic
        run: python -m pytest -q

      # ==========================================
      # 4. Configurar Node.js
      # ==========================================

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ==========================================
      # 5. Instalar dependencias
      # ==========================================

      - name: Instalar frontend original
        working-directory: source-main/frontend
        run: npm ci

      - name: Instalar frontend agentico
        working-directory: source-agentic/frontend
        run: npm ci

      # ==========================================
      # 6. Validar ambas versiones
      # ==========================================

      - name: TypeScript - Original
        working-directory: source-main/frontend
        run: npm run typecheck

      - name: TypeScript - Agentica
        working-directory: source-agentic/frontend
        run: npm run typecheck

      - name: Pruebas frontend - Original
        working-directory: source-main/frontend
        run: npm test

      - name: Pruebas frontend - Agentica
        working-directory: source-agentic/frontend
        run: npm test

      - name: Pyodide - Original
        working-directory: source-main/frontend
        run: npm run smoke:pyodide

      - name: Pyodide - Agentica
        working-directory: source-agentic/frontend
        run: npm run smoke:pyodide

      # ==========================================
      # 7. Compilar ambas aplicaciones
      # ==========================================

      - name: Compilar version original
        working-directory: source-main/frontend
        run: npm run build -- --base=/transactcheck/

      - name: Compilar version agentica
        working-directory: source-agentic/frontend
        run: npm run build -- --base=/transactcheck/agentic/

      # ==========================================
      # 8. Preparar sitio unificado
      # ==========================================

      - name: Unificar versiones para GitHub Pages
        run: |
          mkdir -p site/agentic

          cp -a source-main/frontend/dist/. site/
          cp -a source-agentic/frontend/dist/. site/agentic/

          echo "Contenido publicado:"
          ls -la site/
          ls -la site/agentic/

      # ==========================================
      # 9. Preparar GitHub Pages
      # ==========================================

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ==========================================
  # 10. Desplegar ambas versiones
  # ==========================================

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5